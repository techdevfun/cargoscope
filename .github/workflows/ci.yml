name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: dogfood — measure the fixture crate
        run: |
          npm run build
          mkdir -p /tmp/dogfood/bin
          printf '#!/bin/sh\nexec node "%s" "$@"\n' "$GITHUB_WORKSPACE/dist/index.js" > /tmp/dogfood/bin/cargo-cargoscope
          chmod +x /tmp/dogfood/bin/cargo-cargoscope
          export PATH="/tmp/dogfood/bin:$PATH"
          cd examples/sample-crate
          cargo cargoscope measure --json /tmp/dogfood/before.json
          test -f /tmp/dogfood/before.json
