# nightly — dogfood the nightly toolchain path end to end.
#
# What this proves on a REAL nightly toolchain (not just a recorded fixture):
#  1. `measure` runs the nightly branch (manifest.analysis.nightly === true).
#  2. If this nightly's rustc still accepts -Ztime: the stderr is parsed and
#     the link step is recorded separately (analysis.linkSeconds is a number).
#  3. If -Ztime is gone (removed from rustc by 1.101-nightly, 2026-11-01 —
#     cargo forwards RUSTFLAGS to its own internal rustc probe, so a blind
#     -Ztime breaks the whole build): measure must still SUCCEED and fall
#     back gracefully with linkSeconds null, never crash.
#
# The assertion adapts to the toolchain instead of pinning one, so the job
# stays meaningful as nightly drifts. Runs on a daily schedule (plus manual
# dispatch), not on push — nightly toolchain drift is unrelated to per-push CI.

name: nightly-ztime

on:
  schedule:
    # 03:30 UTC ~= 10:30 ICT, once daily
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: dtolnay/rust-toolchain@nightly
      - name: confirm nightly toolchain
        run: |
          rustc -Vv
          rustc -Vv | grep -q nightly
          cargo --version
      - name: probe -Ztime support on this nightly
        id: ztime
        run: |
          if rustc -Ztime --version >/dev/null 2>&1; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ztime supported: $(grep supported= "$GITHUB_OUTPUT" | cut -d= -f2)"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: dogfood — measure the fixture crate on nightly
        run: |
          mkdir -p /tmp/nightly/bin
          printf '#!/bin/sh\nexec node "%s" "$@"\n' "$GITHUB_WORKSPACE/dist/index.js" > /tmp/nightly/bin/cargo-cargoscope
          chmod +x /tmp/nightly/bin/cargo-cargoscope
          export PATH="/tmp/nightly/bin:$PATH"
          cd examples/sample-crate
          cargo cargoscope measure --json /tmp/nightly/manifest.json
          test -f /tmp/nightly/manifest.json
      - name: assert the nightly branch behaved correctly
        env:
          ZTIME_SUPPORTED: ${{ steps.ztime.outputs.supported }}
        run: |
          node -e '
            const assert = require("node:assert/strict");
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("/tmp/nightly/manifest.json", "utf8"));
            const a = m.analysis;
            // 1. the nightly branch really ran on a nightly toolchain
            assert.equal(a.nightly, true, "expected analysis.nightly === true on a nightly toolchain");
            const ls = a.linkSeconds;
            if (process.env.ZTIME_SUPPORTED === "true") {
              // 2. -Ztime accepted: link step must be recorded separately
              assert.equal(typeof ls, "number", "expected numeric linkSeconds when -Ztime is supported");
              assert.ok(Number.isFinite(ls), "linkSeconds must be finite");
              console.log("nightly -Ztime linkSeconds:", ls);
            } else {
              // 3. -Ztime removed: graceful fallback, no crash, linkSeconds stays null
              assert.equal(ls, null, "expected linkSeconds null when -Ztime is unsupported");
              console.log("nightly without -Ztime: measure succeeded, linkSeconds null (graceful fallback)");
            }
          '
